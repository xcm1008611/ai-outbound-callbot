services:
  smartaster:
    image: docker.qidiangk.com/smartaster/smart-boot:1.0.1
    container_name: smartaster
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/:/app/springboot/logs/
      - ./file/:/data/file/
      - smart_voice_data:/data/
    environment:
      - REDIS_HOST=host.docker.internal
      - REDIS_PASSWORD=xxxxx
      - REDIS_PORT=6379
      - REDIS_DATABASE=3
      - DASHSCOPE_API_KEY=xxxxxxxxxx
      - DEEPSEEK_API_KEY=xxxxxxxxxxxx
      - DB_MASTER_ADDRESS=host.docker.internal:3306
      - DB_MASTER_PASSWORD=xxxxxxx
      - DB_ASTERISK_ADDRESS=host.docker.internal:3306
      - DB_ASTERISK_PASSWORD=xxxxxxx
      - ASTERISK_AMI_HOST=host.docker.internal
      - MAXKB_BASE_URL=http://host.docker.internal:5001/
      - MAXKB_EXTERNAL_BASE_URL=https://maxkb.xxxx.com/
      - JPOWER_FILE_SERVER_PATH=/data/file/
    ports:
      - "9999:9999"

volumes:
  smart_voice_data:
    name: smart_voice_data