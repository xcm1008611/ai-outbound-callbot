spring:
  ai:
    dashscope: # 通义千问
      api-key: xxxxxxxxxxxxxxxxxxxxxxxx
      #      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: qwen3.5-plus
          multiModel: true
    deepseek:
      api-key: xxxxxxxxxxxxxxxxxxx
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          model: deepseek-r1-distill-qwen-32b

jpower:
  ai:
    primary: dashscope

logging:
  level:
    org.asteriskjava.manager: info
    org.asteriskjava: info

asterisk:
  transport: transport-udp
  ami:
    host: 127.0.0.1
    port: 5038
    username: admin
    password: a1b2c3
    event: true
  agi:
    port: 4573
  voice-root-dir: /data/
  context:
    out: outbound-dialer # 呼出上下文名称
    in: inbound-dialer # 呼入上下文名称
    exten: robot

ivr:
  ali:
    accessKeyId: xxxxxxxxxxxxxxxxxxxxxxxx
    accessKeySecret: xxxxxxxxxxxxxxxxxxxxxxxx
    app-key: xxxxxxxxxxxxxxxxxxxxxxxx
    tts-option:
      voice: siyue
      format: wav
      sample-rate: sample_rate_8k
      volume: 50
      pitch-rate: 0
      speech-rate: 0
      min-send-interval-ms: 100
    asr-option:
      format: wav
      sample-rate: sample_rate_8k
      max-sentence-silence: 800
      enable-intermediate-result: true
    asr-file-role:
      region-id: cn-beijing
      version: 2018-08-17
      auto-split: true
      supervise-type: 1
      speaker-num: 2
      enable-inverse-text-normalization: true
      enable-disfluency: true
      enable-semantic-sentence-detection: true
      file-dir: /data/download/
      file-domain: https://kefu.wdrlyxgs.com:4104/ivr-api/maxkb/dataset/transferFile/
    # dashscope 配置，默认 DashScope ASR 引擎
    dashscope:
      # DashScope API Key
      api-key: ${IVR_DASHSCOPE_API_KEY:${spring.ai.dashscope.api-key}}
      # 自定义 WebSocket 地址（内网私有化部署时配置，留空使用官方地址）
      # websocket-url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
      asr-option:
        # 模型
        model: qwen3-asr-flash-realtime
        # 音频格式：pcm（默认）/ wav
        format: wav
        # 采样率：8000（电话场景）
        sample-rate: 8000
        # VAD 断句静音时长（ms），200~6000，默认 800
        max-end-silence: 800
        # 音频源语言
        language: zh
        # VAD 噪音阈值
        turn-detection-threshold: 0.8
        ################################# 以下只有qwen类型模型生效
        # 是否开启服务端 VAD 断句
        enable-turn-detection: true
        # 上下文文本/热词偏置，最大 10000 tokens
        # corpus-text: ""
        ################################# 以下只有fun类型模型生效
        # 是否开启语义标点（根据语义自动断句加标点, 设置为true以后将不根据VAD来判断断句）
        semantic-punctuation-enabled: false
        # 自定义热词表 ID（对应 SDK 字段 phraseId），在 DashScope 控制台创建热词表后填入
        # phrase-id: phrasexxx
      tts-option:
        # TTS 模型：CosyVoice 系列（cosyvoice-v3-flash 推荐）/ Qwen-TTS 系列（qwen3-tts-flash-realtime）
        model: qwen3-tts-flash-realtime
        # 音色：CosyVoice 常用 longanyang / longxiaochun；Qwen-TTS 常用 Cherry / Ethan
        #      voice: Cherry
        # 采样率：8000（电话场景）/ 24000（Qwen-TTS 默认）
        sample-rate: 8000
        # 音量 [0, 100]，默认 50
        volume: 50
        # 语速 [0.5, 2.0]，默认 1.0
        speech-rate: 1.0
        # 语调 [0.5, 2.0]，默认 1.0
        pitch-rate: 1.0
  dianxin:
    asr-url: wss://openapi.teleagi.cn:443/aipaas/voice/v1/asr/fy
    tts-url: wss://openapi.teleagi.cn:443/aipaas/voice/v1/tts/supernaturalrt
    appId: xxxxxxxxxxxxxxxxxxxxxxxx
    appKey: xxxxxxxxxxxxxxxxxxxxxxxx
    tts-option:
      voice: kefunv2
      sample-rate: 8000
    asr-option:
      sample-rate: 8000
      enable-punctuation: true
      enable-inverse-text-normalization: true
      enable-emendation: true
      max-end-silence: 600